<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字學習網 — Glassmorphism Anime</title>
    <style>
        /* ============================================
           GLASSMORPHISM ANIME DESIGN
           ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@400;600;700;800&display=swap');

        :root {
            /* Glassmorphism Color Palette */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-strong: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);

            /* Anime Vibrant Colors */
            --anime-pink: #FF6B9D;
            --anime-purple: #C44DFF;
            --anime-blue: #4D9FFF;
            --anime-cyan: #4DFFF3;
            --anime-yellow: #FFE44D;
            --anime-orange: #FF9A4D;

            /* Text */
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);

            /* Gradients */
            --gradient-bg: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --gradient-pink-purple: linear-gradient(135deg, #FF6B9D, #C44DFF);
            --gradient-blue-cyan: linear-gradient(135deg, #4D9FFF, #4DFFF3);
            --gradient-orange-yellow: linear-gradient(135deg, #FF9A4D, #FFE44D);
            --gradient-rainbow: linear-gradient(135deg, #FF6B9D, #C44DFF, #4D9FFF, #4DFFF3);

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;

            /* Typography */
            --font-family: 'Poppins', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
            --font-size-2xl: 24px;
            --font-size-3xl: 32px;
            --font-size-4xl: 40px;
            --font-size-5xl: 48px;
            --font-size-6xl: 64px;

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;

            /* Transitions */
            --transition-fast: 150ms ease-out;
            --transition-normal: 300ms ease-out;
            --transition-slow: 500ms ease-out;
            --transition-bounce: 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--gradient-bg);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           ANIMATED BACKGROUND ORBS
           ============================================ */
        .bg-orbs {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--anime-pink);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--anime-purple);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: var(--anime-blue);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        .orb-4 {
            width: 300px;
            height: 300px;
            background: var(--anime-cyan);
            top: 20%;
            right: 10%;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(30px, 50px) scale(1.05); }
        }

        /* ============================================
           HEADER — Glass Bar
           ============================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: var(--space-4) var(--space-6);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .header-logo {
            width: 44px;
            height: 44px;
            background: var(--gradient-pink-purple);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: var(--font-size-xl);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.4);
        }

        .header-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        /* ============================================
           CONTROLS — Glass Panel
           ============================================ */
        .controls {
            max-width: 1400px;
            margin: var(--space-6) auto;
            padding: var(--space-4) var(--space-6);
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-2) var(--space-4);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
        }

        .select-group label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .select-group select {
            appearance: none;
            -webkit-appearance: none;
            padding: var(--space-2) var(--space-4);
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            min-width: 120px;
            transition: all var(--transition-fast);
        }

        .select-group select:hover {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.2);
        }

        .select-group select:focus {
            outline: none;
            border-color: var(--anime-cyan);
            box-shadow: 0 0 0 3px rgba(77, 255, 243, 0.2);
        }

        .select-group select option {
            background: #1a1a2e;
            color: white;
        }

        /* ============================================
           WORD LIST — Glass Cards Grid
           ============================================ */
        .word-list-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-4) var(--space-6) var(--space-16);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-5);
        }

        .word-list-container .message {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-16);
            color: var(--text-secondary);
            font-size: var(--font-size-lg);
        }

        /* ============================================
           WORD CARD — Glassmorphism
           ============================================ */
        .word-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            transition: all var(--transition-normal);
            overflow: hidden;
        }

        .word-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .word-card:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-strong);
            box-shadow: var(--glass-shadow-lg);
        }

        .word-card:hover::before {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
        }

        .word-card .word-info {
            flex: 1;
            text-align: center;
        }

        .word-card .english {
            font-size: var(--font-size-3xl);
            font-weight: 800;
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-1);
            letter-spacing: -0.02em;
        }

        .word-card .phonetic {
            font-size: var(--font-size-sm);
            color: var(--text-tertiary);
            font-family: 'SF Mono', monospace;
            margin-bottom: var(--space-3);
        }

        .word-card .details {
            font-size: var(--font-size-lg);
            color: var(--text-primary);
            font-weight: 500;
        }

        .word-card .pos {
            display: inline-block;
            padding: var(--space-1) var(--space-3);
            background: var(--gradient-pink-purple);
            color: white;
            font-size: var(--font-size-xs);
            font-weight: 600;
            border-radius: var(--radius-full);
            margin-right: var(--space-2);
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.3);
        }

        .word-card .sentence {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-top: var(--space-3);
            font-style: italic;
            line-height: 1.5;
        }

        /* Play Button — Gradient Circle */
        .play-audio-btn {
            width: 56px;
            height: 56px;
            background: var(--gradient-blue-cyan);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: center;
            transition: all var(--transition-bounce);
            box-shadow: 0 4px 16px rgba(77, 159, 255, 0.4);
        }

        .play-audio-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(77, 159, 255, 0.6);
        }

        .play-audio-btn:active {
            transform: scale(0.95);
        }

        .play-audio-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           TEACHING MODE BUTTON
           ============================================ */
        #toggle-teaching-mode {
            padding: var(--space-3) var(--space-6);
            background: var(--gradient-pink-purple);
            color: white;
            border: none;
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-bounce);
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.4);
            letter-spacing: 0.02em;
        }

        #toggle-teaching-mode:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 24px rgba(255, 107, 157, 0.6);
        }

        #toggle-teaching-mode:active {
            transform: scale(0.98);
        }

        .modal-open #toggle-teaching-mode {
            background: var(--gradient-orange-yellow);
            box-shadow: 0 4px 16px rgba(255, 154, 77, 0.4);
        }

        /* ============================================
           MODAL — Full Screen Glass
           ============================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content #word-list {
            position: relative;
            display: block;
            width: min(92vw, 1100px);
            height: min(86vh, 680px);
            max-width: none;
            margin: 0;
            padding: 0;
        }

        .modal-content .word-card {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-5);
            padding: var(--space-12) var(--space-16);
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-2xl);
            box-shadow: var(--glass-shadow-lg);
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            transition: opacity var(--transition-normal), transform var(--transition-normal);
        }

        .modal-content .word-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .modal-content .word-card .word-info {
            flex: 0 0 auto;
            width: 100%;
            text-align: center;
        }

        .modal-content .word-card .english {
            font-size: clamp(64px, 10vw, 160px);
            line-height: 1.1;
            white-space: nowrap;
        }

        .modal-content .word-card .phonetic {
            font-size: var(--font-size-2xl);
        }

        .modal-content .word-card .details {
            font-size: var(--font-size-3xl);
        }

        .modal-content .word-card .sentence {
            font-size: var(--font-size-xl);
        }

        .modal-content .play-audio-btn {
            width: 80px;
            height: 80px;
            font-size: 34px;
        }

        /* Close Button */
        .modal-close-btn {
            position: absolute;
            top: var(--space-6);
            right: var(--space-6);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 24px;
        }

        .modal-close-btn:hover {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
            border-color: var(--glass-border-strong);
        }

        /* ============================================
           SPARKLE ANIMATION
           ============================================ */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: var(--space-2);
                text-align: center;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .select-group {
                justify-content: space-between;
            }

            .word-list-container {
                grid-template-columns: 1fr;
                padding: var(--space-4);
            }

            .modal-content #word-list {
                width: 94vw;
                height: min(82vh, 560px);
            }

            .modal-content .word-card {
                padding: var(--space-6);
                margin: 0;
            }

            .modal-content .word-card .english {
                font-size: clamp(40px, 13vw, 96px);
            }
        }

        /* ============================================
           ACCESSIBILITY
           ============================================ */
        :focus-visible {
            outline: 2px solid var(--anime-cyan);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           LEARNING ACTIVITIES — Glass Theme
           ============================================ */
        :root {
            --a-success: #34D399;
            --a-success-bg: rgba(52, 211, 153, 0.16);
            --a-danger: #F87171;
            --a-danger-bg: rgba(248, 113, 113, 0.16);
            --a-warning: #FBBF24;
        }

        /* Activity Bar */
        .activity-bar {
            max-width: 1400px;
            margin: 0 auto var(--space-4);
            padding: 0 var(--space-6);
            display: flex;
            justify-content: center;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .activity-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-1);
            min-width: 92px;
            padding: var(--space-3) var(--space-4);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-bounce);
        }

        .activity-btn:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-strong);
            background: var(--glass-bg-strong);
            box-shadow: var(--glass-shadow);
        }

        .activity-icon {
            font-size: var(--font-size-xl);
            font-weight: 800;
            line-height: 1.2;
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .activity-label {
            font-size: var(--font-size-xs);
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Activity Panel */
        .a-panel {
            position: relative;
            width: 100%;
            max-width: 640px;
            max-height: 90vh;
            overflow-y: auto;
            margin: var(--space-4);
            padding: var(--space-8);
            background: var(--glass-bg-strong);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius-2xl);
            box-shadow: var(--glass-shadow-lg);
        }

        .a-panel h2 {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
            padding-right: var(--space-12);
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .a-panel .modal-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-4);
        }

        .a-panel .modal-close {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: var(--font-size-2xl);
            line-height: 1;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .a-panel .modal-close:hover {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
            border-color: var(--glass-border-strong);
        }

        /* Shared buttons */
        .quiz-next-btn,
        .quiz-retry-btn,
        .spelling-submit,
        .race-btn {
            padding: var(--space-3) var(--space-6);
            border: none;
            border-radius: var(--radius-full);
            font-family: inherit;
            font-size: var(--font-size-sm);
            font-weight: 700;
            color: #fff;
            background: var(--gradient-pink-purple);
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.3);
        }

        .quiz-next-btn:hover:not(:disabled),
        .quiz-retry-btn:hover,
        .spelling-submit:hover,
        .race-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
        }

        .quiz-next-btn:disabled,
        .spelling-submit:disabled,
        .spelling-submit:disabled:hover {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hint-btn {
            background: linear-gradient(135deg, #FBBF24, #F59E0B) !important;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3) !important;
        }

        /* Progress */
        .quiz-progress { margin-top: var(--space-3); }

        .quiz-progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: var(--space-2);
        }

        .quiz-progress-fill {
            height: 100%;
            width: 0;
            background: var(--gradient-blue-cyan);
            border-radius: var(--radius-full);
            transition: width var(--transition-normal);
        }

        .quiz-progress-text {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }

        /* Quiz */
        .quiz-header { margin-bottom: var(--space-5); }
        .quiz-question { text-align: center; margin-bottom: var(--space-5); }
        .quiz-question-label { color: var(--text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--space-2); }

        .quiz-question-word {
            font-size: var(--font-size-4xl);
            font-weight: 800;
            background: var(--gradient-blue-cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-top: var(--space-4);
        }

        .quiz-option {
            padding: var(--space-4) var(--space-5);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--font-size-base);
            text-align: left;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .quiz-option:hover:not(:disabled) {
            border-color: var(--anime-cyan);
            background: var(--glass-bg-strong);
            transform: translateX(4px);
        }

        .quiz-option:disabled { cursor: default; }

        .quiz-option.correct {
            border-color: var(--a-success);
            background: var(--a-success-bg);
            color: var(--a-success);
            font-weight: 700;
        }

        .quiz-option.incorrect {
            border-color: var(--a-danger);
            background: var(--a-danger-bg);
            color: var(--a-danger);
            font-weight: 700;
        }

        .quiz-feedback {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .quiz-feedback.visible { display: block; }
        .quiz-feedback.correct { background: var(--a-success-bg); color: var(--a-success); }
        .quiz-feedback.incorrect { background: var(--a-danger-bg); color: var(--a-danger); }

        .quiz-actions {
            margin-top: var(--space-5);
            display: flex;
            justify-content: center;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .quiz-results { text-align: center; padding: var(--space-4) 0; }

        .quiz-score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto var(--space-5);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border-strong);
            box-shadow: var(--glass-shadow);
        }

        .quiz-score {
            font-size: var(--font-size-4xl);
            font-weight: 800;
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quiz-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-8);
            margin-bottom: var(--space-5);
            font-size: var(--font-size-lg);
            color: var(--text-secondary);
        }

        .quiz-stats strong { color: var(--text-primary); }

        /* Matching */
        .matching-game {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-3);
            margin: var(--space-4) 0;
        }

        .matching-card {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            word-break: break-word;
        }

        .matching-card:hover:not(.matched) {
            border-color: var(--anime-cyan);
            background: var(--glass-bg-strong);
        }

        .matching-card.selected {
            border-color: var(--anime-yellow);
            background: rgba(255, 228, 77, 0.15);
            box-shadow: 0 0 0 2px rgba(255, 228, 77, 0.3);
        }

        .matching-card.matched {
            border-color: var(--a-success);
            background: var(--a-success-bg);
            color: var(--a-success);
            cursor: default;
        }

        .matching-card.mismatch {
            border-color: var(--a-danger);
            background: var(--a-danger-bg);
        }

        .matching-progress {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Spelling */
        .spelling-hint {
            text-align: center;
            font-size: var(--font-size-xl);
            margin-bottom: var(--space-5);
            padding: var(--space-4);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
        }

        .spelling-input-area {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }

        .spelling-input {
            flex: 1;
            min-width: 160px;
            padding: var(--space-3) var(--space-4);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--font-size-lg);
            letter-spacing: 0.05em;
        }

        .spelling-input::placeholder { color: var(--text-tertiary); }

        .spelling-input:focus {
            outline: none;
            border-color: var(--anime-cyan);
            box-shadow: 0 0 0 3px rgba(77, 255, 243, 0.2);
        }

        .spelling-feedback {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            margin-bottom: var(--space-4);
            display: none;
        }

        .spelling-feedback.visible { display: block; }
        .spelling-feedback.correct { background: var(--a-success-bg); color: var(--a-success); }
        .spelling-feedback.incorrect { background: var(--a-danger-bg); color: var(--a-danger); }

        .spelling-progress { text-align: center; color: var(--text-secondary); }

        /* Race */
        .race-timer {
            text-align: center;
            font-size: var(--font-size-6xl);
            font-weight: 800;
            color: var(--anime-cyan);
            margin-bottom: var(--space-5);
            font-variant-numeric: tabular-nums;
        }

        .race-timer.warning {
            color: var(--a-danger);
            animation: race-pulse 1s ease-in-out infinite;
        }

        @keyframes race-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .race-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-10);
            text-align: center;
            margin-bottom: var(--space-5);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .race-word {
            font-size: var(--font-size-4xl);
            font-weight: 800;
            margin-bottom: var(--space-1);
            background: var(--gradient-rainbow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .race-meaning { font-size: var(--font-size-lg); color: var(--text-secondary); }

        .race-controls {
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            margin-bottom: var(--space-4);
        }

        #race-know { background: linear-gradient(135deg, #34D399, #10B981); box-shadow: 0 4px 16px rgba(52, 211, 153, 0.35); }
        #race-dont-know { background: linear-gradient(135deg, #F87171, #EF4444); box-shadow: 0 4px 16px rgba(248, 113, 113, 0.35); }

        .race-score { text-align: center; font-size: var(--font-size-lg); font-weight: 700; color: var(--text-secondary); }

        /* Word Search */
        .word-search-container {
            display: flex;
            gap: var(--space-5);
            flex-wrap: wrap;
            margin-top: var(--space-4);
        }

        .word-search-grid {
            display: grid;
            gap: 3px;
            flex: 1;
            min-width: 280px;
        }

        .word-search-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'SF Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all var(--transition-fast);
        }

        .word-search-cell:hover { background: var(--glass-bg-strong); }

        .word-search-cell.found {
            background: var(--a-success-bg);
            color: var(--a-success);
            border-color: var(--a-success);
        }

        .word-search-cell.selected,
        .word-search-cell.found.selected {
            background: var(--gradient-blue-cyan);
            color: #fff;
            border-color: transparent;
        }

        .word-search-list { min-width: 150px; }
        .word-search-list h3 { font-size: var(--font-size-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
        .word-search-list ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }

        .word-search-list li {
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-size-sm);
            letter-spacing: 0.05em;
            border-radius: var(--radius-sm);
        }

        .word-search-list li.found { color: var(--a-success); text-decoration: line-through; }

        /* Memory */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-3);
            margin: var(--space-4) 0;
        }

        .memory-card {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-1);
            background: var(--gradient-pink-purple);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: var(--font-size-lg);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-normal);
            word-break: break-word;
        }

        .memory-card:hover:not(.flipped):not(.matched) { transform: scale(1.04); }

        .memory-card.flipped {
            background: var(--glass-bg-strong);
            color: var(--text-primary);
            border-color: var(--anime-cyan);
        }

        .memory-card.matched {
            background: var(--a-success-bg);
            color: var(--a-success);
            border-color: var(--a-success);
            cursor: default;
        }

        .memory-progress { text-align: center; color: var(--text-secondary); font-weight: 600; }

        /* Dictation */
        .quiz-type-badge {
            display: inline-block;
            padding: var(--space-1) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-3);
        }

        .quiz-type-badge.dictation { background: rgba(251, 191, 36, 0.18); color: var(--a-warning); }
        .quiz-type-badge.choice { background: rgba(77, 159, 255, 0.18); color: var(--anime-blue); }

        .dictation-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
        }

        .play-word-btn {
            width: 88px;
            height: 88px;
            border: none;
            border-radius: 50%;
            background: var(--gradient-blue-cyan);
            color: #fff;
            font-size: var(--font-size-3xl);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-bounce);
            box-shadow: 0 6px 24px rgba(77, 159, 255, 0.4);
        }

        .play-word-btn:hover { transform: scale(1.08); }
        .play-word-btn:active { transform: scale(0.95); }

        .hint-line { min-height: 1.6em; color: var(--text-secondary); text-align: center; }
        .hint-word { font-weight: 700; color: var(--text-primary); letter-spacing: 0.2em; }

        .review-list {
            margin: var(--space-5) 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            text-align: left;
            max-height: 320px;
            overflow-y: auto;
        }

        .review-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            background: var(--glass-bg);
            border-left: 4px solid var(--a-success);
            font-size: var(--font-size-sm);
        }

        .review-item.wrong { border-left-color: var(--a-danger); }
        .review-item .r-word { font-weight: 700; color: var(--anime-cyan); }
        .review-item .r-answer { color: var(--text-secondary); }
        .review-item.wrong .r-answer { color: var(--a-danger); font-weight: 600; }

        /* Activity notice (replaces alert) */
        .activity-notice {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 700;
            background: var(--a-success-bg);
            color: var(--a-success);
            display: none;
        }

        .activity-notice.visible { display: block; }

        @media (max-width: 768px) {
            .a-panel { padding: var(--space-5); margin: var(--space-2); }
            .memory-grid { grid-template-columns: repeat(3, 1fr); }
            .spelling-input-area { flex-direction: column; }
            .activity-btn { min-width: 76px; padding: var(--space-2) var(--space-3); }
            .review-item { flex-direction: column; align-items: flex-start; gap: var(--space-1); }
            .quiz-question-word { font-size: var(--font-size-3xl); }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- Header -->
    <header class="header" role="banner">
        <div class="header-content">
            <div class="header-brand">
                <div class="header-logo" aria-hidden="true">V</div>
                <div>
                    <h1 class="header-title">英文單字學習網</h1>
                    <p class="header-subtitle">臺中市清水區槺榔國民小學</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Controls -->
    <div class="controls">
        <div class="select-group">
            <label for="grade-select">選擇年級：</label>
            <select id="grade-select">
                <option value="">--請選擇--</option>
                <option value="3">三年級</option>
                <option value="4">四年級</option>
                <option value="5">五年級</option>
                <option value="6">六年級</option>
            </select>
        </div>
        <div class="select-group">
            <label for="week-select">選擇週次：</label>
            <select id="week-select">
                <option value="">--請選擇--</option>
            </select>
        </div>
    </div>

    <!-- Word List -->
    <main id="word-list" class="word-list-container" role="main">
        <p class="message">請選擇年級與週次來開始學習</p>
    </main>

    <!-- Activity Bar -->
    <div id="activity-bar" class="activity-bar" style="display: none;">
        <button class="activity-btn" data-activity="quiz">
            <span class="activity-icon">?</span>
            <span class="activity-label">隨堂測驗</span>
        </button>
        <button class="activity-btn" data-activity="matching">
            <span class="activity-icon">&#8596;</span>
            <span class="activity-label">配對遊戲</span>
        </button>
        <button class="activity-btn" data-activity="spelling">
            <span class="activity-icon">Aa</span>
            <span class="activity-label">拼字蜜蜂</span>
        </button>
        <button class="activity-btn" data-activity="race">
            <span class="activity-icon">&#9201;</span>
            <span class="activity-label">閃卡競速</span>
        </button>
        <button class="activity-btn" data-activity="search">
            <span class="activity-icon">&#8862;</span>
            <span class="activity-label">單字搜索</span>
        </button>
        <button class="activity-btn" data-activity="memory">
            <span class="activity-icon">&#9829;</span>
            <span class="activity-label">記憶配對</span>
        </button>
        <button class="activity-btn" data-activity="dictation">
            <span class="activity-icon">&#9998;</span>
            <span class="activity-label">聽寫測驗</span>
        </button>
    </div>

    <!-- ===== Activity Modals ===== -->
    <!-- Quiz -->
    <div id="quiz-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="quiz-title" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="quiz-modal" aria-label="關閉">&times;</button>
            <h2 id="quiz-title">隨堂測驗</h2>
            <p class="modal-subtitle">從選項中選出單字正確的中文意思</p>
            <div class="quiz-header" id="quiz-header">
                <div class="quiz-progress">
                    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>
                    <p class="quiz-progress-text" id="quiz-progress-text"></p>
                </div>
            </div>
            <div class="quiz-question" id="quiz-question">
                <p class="quiz-question-label">選出這個單字的中文意思</p>
                <p class="quiz-question-word" id="quiz-question-word"></p>
                <div class="quiz-options" id="quiz-options"></div>
                <div class="quiz-feedback" id="quiz-feedback"></div>
            </div>
            <div class="quiz-results" id="quiz-results" style="display: none;">
                <div class="quiz-score-circle"><span class="quiz-score" id="quiz-score">0%</span></div>
                <div class="quiz-stats">
                    <span>答對：<strong id="quiz-correct">0</strong></span>
                    <span>答錯：<strong id="quiz-wrong">0</strong></span>
                </div>
                <button id="view-history-btn" style="width: 100%; margin-top: 10px; padding: 8px; background: var(--gradient-blue-cyan); color: white; border: none; border-radius: var(--radius-md); font-size: 0.9rem; cursor: pointer;">查看歷史分數</button>
            </div>
            <div class="quiz-actions" id="quiz-actions">
                <button class="quiz-next-btn" id="quiz-next-btn" disabled>下一題</button>
                <button class="quiz-retry-btn" id="quiz-retry-btn" style="display: none;">再測一次</button>
            </div>
        </div>
    </div>

    <!-- Score History -->
    <div id="score-history-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="score-history-title" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="score-history-modal" aria-label="關閉">&times;</button>
            <h2 id="score-history-title">歷史分數</h2>
            <p class="modal-subtitle">從過去的測驗中查看您的表現</p>
            <div class="score-history-list" id="score-history-list">
                <p class="message">尚未有測驗紀錄</p>
            </div>
        </div>
    </div>

    <!-- Matching -->
    <div id="matching-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="matching-modal" aria-label="關閉">&times;</button>
            <h2>配對遊戲</h2>
            <p class="modal-subtitle">將英文單字與中文意思配對</p>
            <div class="matching-game" id="matching-game"></div>
            <p class="matching-progress" id="matching-progress"></p>
        </div>
    </div>

    <!-- Spelling -->
    <div id="spelling-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="spelling-modal" aria-label="關閉">&times;</button>
            <h2>拼字蜜蜂</h2>
            <p class="modal-subtitle">根據提示拼出正確的英文單字</p>
            <div class="spelling-hint" id="spelling-hint"></div>
            <div class="spelling-input-area">
                <input type="text" class="spelling-input" id="spelling-input"
                       autocomplete="off" autocorrect="off" autocapitalize="off"
                       spellcheck="false" placeholder="請輸入英文單字…">
                <button class="spelling-submit" id="spelling-submit">送出</button>
            </div>
            <div class="spelling-feedback" id="spelling-feedback"></div>
            <p class="spelling-progress" id="spelling-progress"></p>
        </div>
    </div>

    <!-- Race -->
    <div id="race-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="race-modal" aria-label="關閉">&times;</button>
            <h2>閃卡競速</h2>
            <p class="modal-subtitle">在時間內判斷你是否認識這個單字</p>
            <div class="race-timer" id="race-timer">30</div>
            <div class="race-card">
                <div class="race-word" id="race-word"></div>
                <div class="race-meaning" id="race-meaning"></div>
            </div>
            <div class="race-controls">
                <button class="race-btn" id="race-know">我認識</button>
                <button class="race-btn" id="race-dont-know">不認識</button>
            </div>
            <p class="race-score" id="race-score"></p>
        </div>
    </div>

    <!-- Word Search -->
    <div id="search-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="search-modal" aria-label="關閉">&times;</button>
            <h2>單字搜索</h2>
            <p class="modal-subtitle">依序點選字母方格，找出隱藏的單字</p>
            <div class="word-search-container">
                <div class="word-search-grid" id="word-search-grid"></div>
                <div class="word-search-list" id="word-search-list"></div>
            </div>
        </div>
    </div>

    <!-- Memory -->
    <div id="memory-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="a-panel">
            <button class="modal-close" data-close="memory-modal" aria-label="關閉">&times;</button>
            <h2>記憶配對</h2>

                    <span>答錯：<strong id="d-wrong">0</strong></span>
