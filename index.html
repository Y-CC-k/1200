    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gradeSelect = document.getElementById('grade-select');
            const weekSelect = document.getElementById('week-select');
            const wordListContainer = document.getElementById('word-list');

            let controlsContainer = null;
            let currentGradeData = null;
            let isAudioPlaying = false;

            // --- 教學模式相關變數 ---
            let currentCardIndex = 0;
            let wordCards = [];
            let isAutoplaying = false;
            let autoplayTimeoutId = null;

            const toggleModeBtn = document.createElement('button');
            let modalOverlay = null;
            let modalWordList = null;

            // --- TTS 相關 ---
            let ttsVoices = [];
            let ttsSupported = 'speechSynthesis' in window;

            function loadTtsVoices() {
                if (!ttsSupported) return;
                ttsVoices = speechSynthesis.getVoices();
            }

            if (ttsSupported) {
                loadTtsVoices();
                speechSynthesis.onvoiceschanged = loadTtsVoices;
            }

            function getPreferredVoice() {
                if (ttsVoices.length === 0) ttsVoices = speechSynthesis.getVoices();
                return ttsVoices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                    || ttsVoices.find(v => v.lang === 'en-US')
                    || ttsVoices.find(v => v.lang.startsWith('en'))
                    || ttsVoices[0] || null;
            }

            function speak(text, rate = 0.75) {
                return new Promise((resolve) => {
                    if (!ttsSupported) { resolve(); return; }
                    speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = rate;
                    utterance.pitch = 1.0;
                    const voice = getPreferredVoice();
                    if (voice) utterance.voice = voice;
                    utterance.onend = () => resolve();
                    utterance.onerror = () => resolve();
                    const timeout = setTimeout(() => resolve(), 10000);
                    utterance.onend = () => { clearTimeout(timeout); resolve(); };
                    speechSynthesis.speak(utterance);
                });
            }

            function stopSpeaking() {
                if (ttsSupported) speechSynthesis.cancel();
            }

            // 載入年級資料
            async function handleGradeChange() {
                const selectedGrade = gradeSelect.value;
                const activityBar = document.getElementById('activity-bar');
                weekSelect.innerHTML = '<option value="">--請選擇--</option>';
                wordListContainer.innerHTML = '';
                currentGradeData = null;
                window.studyWords = [];
                window.studyGradeWords = [];
                window.studyTitle = '';
                if (activityBar) activityBar.style.display = 'none';
                if (toggleModeBtn) toggleModeBtn.style.display = 'none';

                if (!selectedGrade) {
                    displayMessage("請先選擇年級。");
                    weekSelect.disabled = true;
                    return;
                }

                weekSelect.disabled = true;
                displayMessage("正在載入年級資料...");

                try {
                    const response = await fetch(`./document/grade${selectedGrade}.json`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    currentGradeData = await response.json();
                    window.studyGradeWords = Array.isArray(currentGradeData.weeks)
                        ? currentGradeData.weeks.flatMap(w => w.content || [])
                        : [];
                    populateWeekSelect();
                    displayMessage("請選擇週次來顯示單字。");
                    weekSelect.disabled = false;
                } catch (error) {
                    console.error("無法載入單字資料:", error);
                    displayMessage(`錯誤：無法載入 ${selectedGrade} 年級的資料。`);
                }
            }

            function populateWeekSelect() {
                if (!currentGradeData || !currentGradeData.weeks) return;
                currentGradeData.weeks.forEach(weekInfo => {
                    const option = document.createElement('option');
                    option.value = weekInfo.week;
                    option.textContent = `第 ${weekInfo.week} 週`;
                    weekSelect.appendChild(option);
                });
            }

            function displayWordsForWeek() {
                const selectedGrade = gradeSelect.value;
                const selectedWeek = weekSelect.value;
                const activityBar = document.getElementById('activity-bar');
                wordListContainer.innerHTML = '';
                window.studyWords = [];
                window.studyTitle = '';
                if (activityBar) activityBar.style.display = 'none';
                if (toggleModeBtn) toggleModeBtn.style.display = 'none';

                if (!selectedGrade || !selectedWeek) return;

                const weekData = currentGradeData.weeks.find(w => w.week.toString() === selectedWeek);
                if (!weekData || weekData.content.length === 0) {
                    displayMessage("這個組合沒有找到任何單字。");
                    return;
                }

                // 提供給學習活動使用的共用資料
                window.studyWords = weekData.content;
                window.studyTitle = `${(currentGradeData && currentGradeData.gradeName) || (selectedGrade + '年級')} 第 ${selectedWeek} 週`;
                if (currentGradeData && Array.isArray(currentGradeData.weeks)) {
                    window.studyGradeWords = currentGradeData.weeks.flatMap(w => w.content || []);
                }

                weekData.content.forEach(word => {
                    const card = createWordCard(word, selectedGrade, selectedWeek);
                    wordListContainer.appendChild(card);
                });

                const mainWordCards = wordListContainer.querySelectorAll('.word-card');
                if (toggleModeBtn && mainWordCards.length > 0) {
                    toggleModeBtn.style.display = 'inline-block';
                }
                if (activityBar) activityBar.style.display = 'flex';
            }

            function createWordCard(word, grade, week) {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word-info">
                        <h2 class="english">${word.word}</h2>
                        <p class="phonetic">${word.phonetic || ''}</p>
                        <p class="details"><span class="pos">${word.pos || ''}</span> ${word.chinese || ''}</p>
                        <p class="sentence">${word.sentence || ''}</p>
                    </div>
                    <button class="play-audio-btn" data-word="${word.word}" data-sentence="${word.sentence || ''}" aria-label="播放 ${word.word} 發音">
                        &#9658;
                    </button>
                `;
                const playBtn = card.querySelector('.play-audio-btn');
                playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playAudioForCard(card);
                });
                return card;
            }

            function displayMessage(message) {
                wordListContainer.innerHTML = `<p class="message">${message}</p>`;
            }

            // --- 教學模式 ---
            async function playAudioForCard(card) {
                if (isAudioPlaying) return;
                const playBtn = card.querySelector('.play-audio-btn');
                if (!playBtn) { await new Promise(r => setTimeout(r, 2000)); return; }

                isAudioPlaying = true;
                playBtn.disabled = true;

                const word = playBtn.dataset.word || '';
                const sentence = playBtn.dataset.sentence || '';

                if (ttsSupported && word) {
                    await speak(word, 0.7);
                    if (sentence) {
                        await new Promise(r => setTimeout(r, 300));
                        await speak(sentence, 0.75);
                    }
                }

                isAudioPlaying = false;
                playBtn.disabled = false;
            }

            async function startAutoplay() {
                isAutoplaying = true;
                while (isAutoplaying && wordCards.length > 0) {
                    const currentCard = wordCards[currentCardIndex];
                    if (!currentCard) break;
                    updateActiveCard();
                    await playAudioForCard(currentCard);
                    if (!isAutoplaying) break;
                    await new Promise(r => { autoplayTimeoutId = setTimeout(r, 1500); });
                    if (!isAutoplaying) break;
                    showNextCard();
                }
            }

            function enterTeachingMode() {
                const mainWordCards = wordListContainer.querySelectorAll('.word-card');
                if (mainWordCards.length === 0) return;

                modalWordList.innerHTML = '';
                mainWordCards.forEach(card => modalWordList.appendChild(card.cloneNode(true)));
                wordCards = modalWordList.querySelectorAll('.word-card');

                modalOverlay.classList.add('active');
                document.body.classList.add('modal-open');
                document.body.style.overflow = 'hidden';
                toggleModeBtn.textContent = '結束教學';
                currentCardIndex = 0;
                // 預先計算所有卡片的字級，避免換字時才縮放造成閃爍
                wordCards.forEach(card => adjustFontSize(card));
                updateActiveCard();
                startAutoplay();
            }

            function exitTeachingMode() {
                isAutoplaying = false;
                clearTimeout(autoplayTimeoutId);
                stopSpeaking();
                modalOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
                toggleModeBtn.textContent = '教學模式';
                if (modalWordList) modalWordList.innerHTML = '';
                wordCards = [];
            }

            function updateActiveCard() {
                wordCards.forEach((card, index) => {
                    if (index === currentCardIndex) {
                        card.classList.add('active');
                        adjustFontSize(card);
                    } else {
                        card.classList.remove('active');
                    }
                });
            }

            function adjustFontSize(card) {
                const englishEl = card.querySelector('.english');
                const container = card.querySelector('.word-info');
                if (!englishEl || !container) return;

                const available = container.clientWidth;
                if (!available) return;

                const maxSize = Math.min(200, Math.round(window.innerHeight * 0.26));
                let fontSize = maxSize;
                englishEl.style.fontSize = `${fontSize}px`;

                let guard = 0;
                while (englishEl.scrollWidth > available && fontSize > 40 && guard++ < 300) {
                    fontSize -= 2;
                    englishEl.style.fontSize = `${fontSize}px`;
                }
            }

            function showNextCard() {
                currentCardIndex = (currentCardIndex + 1) % wordCards.length;
            }

            function setupControlsAndModal() {
                controlsContainer = document.querySelector('.controls');
                if (!controlsContainer) {
                    controlsContainer = document.createElement('div');
                    controlsContainer.className = 'controls';
                    document.body.insertBefore(controlsContainer, wordListContainer);
                }

                toggleModeBtn.id = 'toggle-teaching-mode';
                toggleModeBtn.textContent = '教學模式';
                toggleModeBtn.style.display = 'none';
                controlsContainer.appendChild(toggleModeBtn);

                toggleModeBtn.addEventListener('click', () => {
                    if (document.body.classList.contains('modal-open')) {
                        exitTeachingMode();
                    } else {
                        enterTeachingMode();
                    }
                });

                modalOverlay = document.createElement('div');
                modalOverlay.className = 'modal-overlay';

                const modalContent = document.createElement('div');
                modalContent.className = 'modal-content';

                const closeBtn = document.createElement('button');
                closeBtn.className = 'modal-close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.setAttribute('aria-label', '關閉教學模式');
                closeBtn.onclick = exitTeachingMode;

                modalWordList = document.createElement('div');
                modalWordList.id = 'word-list';

                modalContent.appendChild(modalWordList);
                modalContent.appendChild(closeBtn);
                modalOverlay.appendChild(modalContent);
                document.body.appendChild(modalOverlay);

                document.addEventListener('keydown', (e) => {
                    if (document.body.classList.contains('modal-open') && e.key === 'Escape') {
                        exitTeachingMode();
                    }
                });
            }

            // 程式起始點
            setupControlsAndModal();
            displayMessage("請先選擇年級。");
            weekSelect.disabled = true;
            gradeSelect.addEventListener('change', handleGradeChange);
            weekSelect.addEventListener('change', displayWordsForWeek);
        });
    </script>

    <script>
        // ============================================
        // LEARNING ACTIVITIES (六種活動 + 每週聽寫測驗)
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const $ = (id) => document.getElementById(id);

            function words() {
                return Array.isArray(window.studyWords) ? window.studyWords : [];
            }

            function gradeWords() {
                return Array.isArray(window.studyGradeWords) ? window.studyGradeWords : words();
            }

            function shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            // ============================================
            // TTS
            // ============================================
            const ttsSupported = 'speechSynthesis' in window;
            let ttsVoices = [];

            function loadTtsVoices() { if (ttsSupported) ttsVoices = speechSynthesis.getVoices(); }
            if (ttsSupported) {
                loadTtsVoices();
                speechSynthesis.onvoiceschanged = loadTtsVoices;
            }

            function getPreferredVoice() {
                if (!ttsSupported) return null;
                if (ttsVoices.length === 0) ttsVoices = speechSynthesis.getVoices();
                return ttsVoices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                    || ttsVoices.find(v => v.lang === 'en-US')
                    || ttsVoices.find(v => v.lang.startsWith('en'))
                    || ttsVoices[0] || null;
            }

            function speak(text, rate = 0.75) {
                return new Promise((resolve) => {
                    if (!ttsSupported || !text) { resolve(); return; }
                    speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US';
                    u.rate = rate;
                    u.pitch = 1.0;
                    const voice = getPreferredVoice();
                    if (voice) u.voice = voice;
                    let done = false;
                    const finish = () => { if (done) return; done = true; clearTimeout(timer); resolve(); };
                    const timer = setTimeout(finish, 10000);
                    u.onend = finish;
                    u.onerror = finish;
                    speechSynthesis.speak(u);
                });
            }

            function stopSpeaking() { if (ttsSupported) speechSynthesis.cancel(); }

            // ============================================
            // MODAL MANAGEMENT
            // ============================================
            const cleanupHooks = {};

            function openModal(id) {
                const modal = document.getElementById(id);
                if (!modal) return;
                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeModal(id) {
                if (!id) return;
                const modal = document.getElementById(id);
                if (!modal) return;
                if (typeof cleanupHooks[id] === 'function') {
                    try { cleanupHooks[id](); } catch (err) { console.error(err); }
                }
                stopSpeaking();
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            function isModalOpen(id) {
                const modal = document.getElementById(id);
                return !!(modal && modal.classList.contains('active'));
            }

            function showNotice(modalId, text) {
                const modal = document.getElementById(modalId);
                if (!modal) return;
                let notice = modal.querySelector('.activity-notice');
                if (!notice) {
                    notice = document.createElement('div');
                    notice.className = 'activity-notice';
                    (modal.querySelector('.a-panel') || modal).appendChild(notice);
                }
                notice.textContent = text;
                notice.classList.add('visible');
            }

            function clearNotice(modalId) {
                const modal = document.getElementById(modalId);
                const notice = modal && modal.querySelector('.activity-notice');
                if (notice) notice.classList.remove('visible');
            }

            // Close buttons / overlay click / Escape
            document.querySelectorAll('.modal-close[data-close]').forEach(btn => {
                btn.addEventListener('click', () => closeModal(btn.dataset.close));
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                if (!overlay.id) return;
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal(overlay.id);
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key !== 'Escape') return;
                document.querySelectorAll('.modal-overlay.active').forEach(m => {
                    if (m.id) closeModal(m.id);
                });
            });

            // ============================================
            // ACTIVITY: QUIZ (隨堂測驗)
            // ============================================
            const quizState = { questions: [], current: 0, correct: 0, wrong: 0, answered: false };

            function startQuiz() {
                const list = words();
                if (list.length === 0) return;

                const shuffled = shuffle(list);
                const count = Math.min(5, shuffled.length);
                quizState.questions = shuffled.slice(0, count).map(word => {
                    const others = list.filter(w => w.word !== word.word);
                    const options = shuffle([word, ...shuffle(others).slice(0, 3)]);
                    return { word: word.word, correct: word.chinese, options: options.map(w => w.chinese) };
                });
                quizState.current = 0;
                quizState.correct = 0;
                quizState.wrong = 0;
                quizState.answered = false;

                $('quiz-results').style.display = 'none';
                $('quiz-header').style.display = 'block';
                $('quiz-question').style.display = 'block';
                $('quiz-options').style.display = 'flex';
                $('quiz-feedback').style.display = 'none';
                $('quiz-next-btn').style.display = 'inline-block';
                $('quiz-retry-btn').style.display = 'none';

                renderQuizQuestion();
                openModal('quiz-modal');
            }

            function renderQuizQuestion() {
                const q = quizState.questions[quizState.current];
                quizState.answered = false;

                $('quiz-progress-fill').style.width = `${(quizState.current / quizState.questions.length) * 100}%`;
                $('quiz-progress-text').textContent = `第 ${quizState.current + 1} 題 / 共 ${quizState.questions.length} 題`;
                $('quiz-question-word').textContent = q.word;

                const optionsEl = $('quiz-options');
                optionsEl.innerHTML = q.options.map((opt, i) => `
                    <button class="quiz-option" data-index="${i}" data-correct="${opt === q.correct}">
                        ${String.fromCharCode(65 + i)}. ${opt}
                    </button>
                `).join('');

                const feedback = $('quiz-feedback');
                feedback.className = 'quiz-feedback';
                feedback.textContent = '';

                const nextBtn = $('quiz-next-btn');
                nextBtn.disabled = true;
                nextBtn.textContent = quizState.current === quizState.questions.length - 1 ? '查看結果' : '下一題';

                optionsEl.querySelectorAll('.quiz-option').forEach(btn => {
                    btn.addEventListener('click', () => handleQuizAnswer(btn));
                });
            }

            function handleQuizAnswer(btn) {
                if (quizState.answered) return;
                quizState.answered = true;

                const q = quizState.questions[quizState.current];
                const isCorrect = btn.dataset.correct === 'true';

                document.querySelectorAll('#quiz-options .quiz-option').forEach(opt => {
                    opt.disabled = true;
                    if (opt.dataset.correct === 'true') opt.classList.add('correct');
                });

                const feedback = $('quiz-feedback');
                if (isCorrect) {
                    btn.classList.add('correct');
                    quizState.correct++;
                    feedback.className = 'quiz-feedback visible correct';
                    feedback.textContent = '正確！';
                } else {
                    btn.classList.add('incorrect');
                    quizState.wrong++;
                    feedback.className = 'quiz-feedback visible incorrect';
                    feedback.textContent = `錯誤。正確答案是：${q.correct}`;
                }

                $('quiz-next-btn').disabled = false;
            }

            function nextQuizQuestion() {
                quizState.current++;
                if (quizState.current >= quizState.questions.length) {
                    showQuizResults();
                } else {
                    renderQuizQuestion();
                }
            }

            function showQuizResults() {
                $('quiz-header').style.display = 'none';
                $('quiz-question').style.display = 'none';
                $('quiz-feedback').style.display = 'none';
                $('quiz-results').style.display = 'block';
                $('quiz-next-btn').style.display = 'none';
                $('quiz-retry-btn').style.display = 'inline-block';

                const total = quizState.questions.length;
                const pct = total ? Math.round((quizState.correct / total) * 100) : 0;
                $('quiz-score').textContent = `${pct}%`;
                $('quiz-correct').textContent = quizState.correct;
                $('quiz-wrong').textContent = quizState.wrong;
            }

            $('quiz-next-btn')?.addEventListener('click', nextQuizQuestion);
            $('quiz-retry-btn')?.addEventListener('click', startQuiz);

            // ============================================
            // ACTIVITY: MATCHING GAME (配對遊戲)
            // ============================================
            const matchingState = { pairs: [], selected: null, matched: 0, total: 0 };

            function startMatching() {
                const list = words();
                if (list.length === 0) return;

                const picked = list.slice(0, Math.min(6, list.length));
                const pairs = [];
                picked.forEach(w => {
                    pairs.push({ id: w.word + '_en', text: w.word, pairId: w.word, type: 'en' });
                    pairs.push({ id: w.word + '_cn', text: w.chinese, pairId: w.word, type: 'cn' });
                });
                matchingState.pairs = shuffle(pairs);
                matchingState.selected = null;
                matchingState.matched = 0;
                matchingState.total = picked.length;

                clearNotice('matching-modal');
                renderMatchingGame();
                openModal('matching-modal');
            }

            function renderMatchingGame() {
                const game = $('matching-game');
                game.innerHTML = matchingState.pairs.map(card => `
                    <div class="matching-card" data-id="${card.id}" data-pair="${card.pairId}"
                         data-type="${card.type}" data-text="${card.text}"
                         role="button" tabindex="0" aria-label="${card.text}">?</div>
                `).join('');

                updateMatchingProgress();

                game.querySelectorAll('.matching-card').forEach(card => {
                    card.addEventListener('click', () => handleMatchingClick(card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleMatchingClick(card);
                        }
                    });
                });
            }

            function handleMatchingClick(card) {
                if (card.classList.contains('matched')) return;

                if (!matchingState.selected) {
                    matchingState.selected = card;
                    card.classList.add('selected');
                    return;
                }

                const first = matchingState.selected;
                if (first === card) {
                    card.classList.remove('selected');
                    matchingState.selected = null;
                    return;
                }

                const second = card;
                if (first.dataset.pair === second.dataset.pair && first.dataset.type !== second.dataset.type) {
                    first.classList.remove('selected');
                    first.classList.add('matched');
                    first.textContent = first.dataset.text;
                    second.classList.add('matched');
                    second.textContent = second.dataset.text;

                    matchingState.matched++;
                    matchingState.selected = null;
                    updateMatchingProgress();

                    if (matchingState.matched === matchingState.total) {
                        setTimeout(() => showNotice('matching-modal', '恭喜！完成所有配對！'), 250);
                    }
                } else {
                    first.classList.remove('selected');
                    first.classList.add('mismatch');
                    second.classList.add('mismatch');
                    matchingState.selected = null;
                    setTimeout(() => {
                        first.classList.remove('mismatch');
                        second.classList.remove('mismatch');
                    }, 500);
                }
            }

            function updateMatchingProgress() {
                $('matching-progress').textContent = `已配對: ${matchingState.matched} / ${matchingState.total}`;
            }

            // ============================================
            // ACTIVITY: SPELLING BEE (拼字蜜蜂)
            // ============================================
            const spellingState = { words: [], current: 0, correct: 0, locked: false };

            function startSpelling() {
                const list = words();
                if (list.length === 0) return;

                spellingState.words = shuffle(list).slice(0, Math.min(5, list.length));
                spellingState.current = 0;
                spellingState.correct = 0;
                spellingState.locked = false;

                clearNotice('spelling-modal');
                $('spelling-input').disabled = false;
                $('spelling-submit').disabled = false;

                renderSpellingQuestion();
                openModal('spelling-modal');
                setTimeout(() => $('spelling-input').focus(), 50);
            }

            function renderSpellingQuestion() {
                const word = spellingState.words[spellingState.current];
                spellingState.locked = false;
                $('spelling-hint').textContent = `${word.chinese} ${word.pos ? '(' + word.pos + ')' : ''}`;
                const input = $('spelling-input');
                input.value = '';
                input.disabled = false;
                $('spelling-submit').disabled = false;
                const feedback = $('spelling-feedback');
                feedback.className = 'spelling-feedback';
                feedback.textContent = '';
                $('spelling-progress').textContent = `第 ${spellingState.current + 1} 題 / 共 ${spellingState.words.length} 題`;
            }

            function checkSpelling() {
                if (spellingState.locked) return;
                const word = spellingState.words[spellingState.current];
                if (!word) return;

                const input = $('spelling-input');
                const value = input.value.trim();
                if (!value) { input.focus(); return; }

                spellingState.locked = true;
                const feedback = $('spelling-feedback');

                if (value.toLowerCase() === word.word.toLowerCase()) {
                    feedback.className = 'spelling-feedback visible correct';
                    feedback.textContent = `正確！${word.word} - ${word.chinese}`;
                    spellingState.correct++;
                } else {
                    feedback.className = 'spelling-feedback visible incorrect';
                    feedback.textContent = `錯誤。正確答案是：${word.word}`;
                }

                setTimeout(() => {
                    if (!isModalOpen('spelling-modal')) return;
                    spellingState.current++;
                    if (spellingState.current >= spellingState.words.length) {
                        showNotice('spelling-modal', `測驗完成！答對 ${spellingState.correct} / ${spellingState.words.length} 題`);
                        input.disabled = true;
                        $('spelling-submit').disabled = true;
                    } else {
                        renderSpellingQuestion();
                        input.focus();
                    }
                }, 1400);
            }

            $('spelling-submit')?.addEventListener('click', checkSpelling);
            $('spelling-input')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); checkSpelling(); }
            });

            // ============================================
            // ACTIVITY: FLASHCARD RACE (閃卡競速)
            // ============================================
            const raceState = { words: [], current: 0, known: 0, unknown: 0, timeLeft: 30, timer: null, active: false };

            function startRace() {
                const list = words();
                if (list.length === 0) return;

                raceState.words = shuffle(list);
                raceState.current = 0;
                raceState.known = 0;
                raceState.unknown = 0;
                raceState.timeLeft = 30;
                raceState.active = true;

                const timerEl = $('race-timer');
                timerEl.textContent = '30';
                timerEl.classList.remove('warning');
                clearNotice('race-modal');

                renderRaceCard();
                openModal('race-modal');

                clearInterval(raceState.timer);
                raceState.timer = setInterval(() => {
                    if (!isModalOpen('race-modal')) { endRace(); return; }
                    raceState.timeLeft--;
                    timerEl.textContent = raceState.timeLeft;
                    if (raceState.timeLeft <= 10) timerEl.classList.add('warning');
                    if (raceState.timeLeft <= 0) endRace();
                }, 1000);
            }

            function renderRaceCard() {
                const word = raceState.words[raceState.current];
                if (!word) return;
                $('race-word').textContent = word.word;
                $('race-meaning').textContent = word.chinese;
                updateRaceScore();
            }

            function updateRaceScore() {
                $('race-score').textContent = `認識 ${raceState.known} / 已看 ${raceState.current}`;
            }

            function handleRaceAction(know) {
                if (!raceState.active) return;
                if (know) raceState.known++;
                else raceState.unknown++;
                raceState.current++;

                if (raceState.current >= raceState.words.length) {
                    raceState.current = 0;
                    raceState.words = shuffle(words());
                }
                renderRaceCard();
            }

            function endRace() {
                const wasActive = raceState.active;
                raceState.active = false;
                clearInterval(raceState.timer);
                raceState.timer = null;
                if (wasActive && isModalOpen('race-modal')) {
                    showNotice('race-modal', `時間到！認識 ${raceState.known} 個，不認識 ${raceState.unknown} 個`);
                }
            }

            $('race-know')?.addEventListener('click', () => handleRaceAction(true));
            $('race-dont-know')?.addEventListener('click', () => handleRaceAction(false));

            cleanupHooks['race-modal'] = () => {
                raceState.active = false;
                clearInterval(raceState.timer);
                raceState.timer = null;
            };

            // ============================================
            // ACTIVITY: WORD SEARCH (單字搜索)
            // ============================================
            function startWordSearch() {
                const list = words();
                if (list.length === 0) return;

                const gridSize = 10;
                const grid = Array(gridSize * gridSize).fill('');
                const placed = [];
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

                list.slice(0, Math.min(8, list.length)).forEach(item => {
                    const word = String(item.word).toUpperCase().replace(/[^A-Z]/g, '');
                    if (word.length < 2 || word.length > gridSize) return;

                    for (let attempt = 0; attempt < 100; attempt++) {
                        const horizontal = Math.random() > 0.5;
                        const row = Math.floor(Math.random() * gridSize);
                        const col = Math.floor(Math.random() * gridSize);

                        if (horizontal && col + word.length <= gridSize) {
                            let ok = true;
                            for (let i = 0; i < word.length; i++) {
                                const c = grid[row * gridSize + col + i];
                                if (c !== '' && c !== word[i]) { ok = false; break; }
                            }
                            if (ok) {
                                for (let i = 0; i < word.length; i++) grid[row * gridSize + col + i] = word[i];
                                placed.push({ word, label: item.word, cells: Array.from({ length: word.length }, (_, i) => row * gridSize + col + i), done: false });
                                break;
                            }
                        } else if (!horizontal && row + word.length <= gridSize) {
                            let ok = true;
                            for (let i = 0; i < word.length; i++) {
                                const c = grid[(row + i) * gridSize + col];
                                if (c !== '' && c !== word[i]) { ok = false; break; }
                            }
                            if (ok) {
                                for (let i = 0; i < word.length; i++) grid[(row + i) * gridSize + col] = word[i];
                                placed.push({ word, label: item.word, cells: Array.from({ length: word.length }, (_, i) => (row + i) * gridSize + col), done: false });
                                break;
                            }
                        }
                    }
                });

                for (let i = 0; i < grid.length; i++) {
                    if (grid[i] === '') grid[i] = letters[Math.floor(Math.random() * letters.length)];
                }

                const gridEl = $('word-search-grid');
                gridEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
                gridEl.innerHTML = grid.map((letter, i) => `
                    <div class="word-search-cell" data-index="${i}">${letter}</div>
                `).join('');

                const listEl = $('word-search-list');
                listEl.innerHTML = `<h3>找出這些單字：</h3><ul>${placed.map(p => `<li data-word="${p.label}">${p.label}</li>`).join('')}</ul>`;

                clearNotice('search-modal');

                let selected = [];
                gridEl.querySelectorAll('.word-search-cell').forEach(cell => {
                    cell.addEventListener('click', () => {
                        const idx = parseInt(cell.dataset.index, 10);
                        if (cell.classList.toggle('selected')) selected.push(idx);
                        else selected = selected.filter(i => i !== idx);

                        const str = selected.map(i => grid[i]).join('');
                        const hit = placed.find(p => !p.done && p.word === str);
                        if (hit) {
                            hit.done = true;
                            hit.cells.forEach(ci => {
                                const c = gridEl.querySelector(`.word-search-cell[data-index="${ci}"]`);
                                if (c) { c.classList.remove('selected'); c.classList.add('found'); }
                            });
                            const listItem = listEl.querySelector(`li[data-word="${hit.label}"]`);
                            if (listItem) listItem.classList.add('found');
                            selected = [];
                            if (placed.length > 0 && placed.every(p => p.done)) {
                                showNotice('search-modal', '太棒了！找到所有單字！');
                            }
                        }
                    });
                });

                openModal('search-modal');
            }

            // ============================================
            // ACTIVITY: MEMORY MATCH (記憶配對)
            // ============================================
            const memoryState = { cards: [], flipped: [], matched: 0, moves: 0, total: 0, lock: false };

            function startMemory() {
                const list = words();
                if (list.length === 0) return;

                const picked = list.slice(0, Math.min(6, list.length));
                const cards = [];
                picked.forEach(w => {
                    cards.push({ id: w.word + '_1', text: w.word, pairId: w.word });
                    cards.push({ id: w.word + '_2', text: w.chinese, pairId: w.word });
                });
                memoryState.cards = shuffle(cards);
                memoryState.flipped = [];
                memoryState.matched = 0;
                memoryState.moves = 0;
                memoryState.total = picked.length;
                memoryState.lock = false;

                clearNotice('memory-modal');
                renderMemoryGrid();
                openModal('memory-modal');
            }

            function renderMemoryGrid() {
                const grid = $('memory-grid');
                grid.innerHTML = memoryState.cards.map(card => `
                    <div class="memory-card" data-id="${card.id}" data-pair="${card.pairId}"
                         data-text="${card.text}" role="button" tabindex="0" aria-label="記憶卡片">?</div>
                `).join('');

                updateMemoryProgress();

                grid.querySelectorAll('.memory-card').forEach(card => {
                    card.addEventListener('click', () => handleMemoryClick(card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleMemoryClick(card);
                        }
                    });
                });
            }

            function handleMemoryClick(card) {
                if (memoryState.lock) return;
                if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
                if (memoryState.flipped.length >= 2) return;

                card.classList.add('flipped');
                card.textContent = card.dataset.text;
                memoryState.flipped.push(card);

                if (memoryState.flipped.length === 2) {
                    memoryState.moves++;
                    updateMemoryProgress();

                    const [first, second] = memoryState.flipped;
                    if (first.dataset.pair === second.dataset.pair) {
                        first.classList.remove('flipped');
                        second.classList.remove('flipped');
                        first.classList.add('matched');
                        second.classList.add('matched');
                        memoryState.matched++;
                        memoryState.flipped = [];

                        if (memoryState.matched === memoryState.total) {
                            setTimeout(() => showNotice('memory-modal', `恭喜！用了 ${memoryState.moves} 步完成所有配對！`), 250);
                        }
                    } else {
                        memoryState.lock = true;
                        setTimeout(() => {
                            first.classList.remove('flipped');
                            second.classList.remove('flipped');
                            first.textContent = '?';
                            second.textContent = '?';
                            memoryState.flipped = [];
                            memoryState.lock = false;
                        }, 800);
                    }
                }
            }

            function updateMemoryProgress() {
                $('memory-progress').textContent = `步數: ${memoryState.moves}`;
            }

            // ============================================
            // ACTIVITY: WEEKLY DICTATION QUIZ (每週聽寫測驗)
            // ============================================
            const dictationState = { quiz: null };

            function answerKey(word) {
                // 去除資料中的註記，如 "not (again)" -> "not"
                return String(word).replace(/\s*\([^)]*\)\s*/g, ' ').trim();
            }

            function normalize(str) {
                return String(str).toLowerCase().replace(/[^a-z0-9]/g, '').trim();
            }

            function buildDictationQuestions() {
                const weekWords = words();
                const pool = gradeWords();
                const questions = [];

                weekWords.forEach(w => {
                    // 聽寫題
                    questions.push({
                        type: 'dictation',
                        word: w.word,
                        answer: answerKey(w.word),
                        phonetic: w.phonetic || '',
                        chinese: w.chinese || ''
                    });

                    // 詞義選擇題
                    const correct = w.chinese || '';
                    const distractors = shuffle([...new Set(
                        pool
                            .filter(x => x.chinese && x.chinese !== correct && x.word !== w.word)
                            .map(x => x.chinese)
                    )]).slice(0, 3);
                    questions.push({
                        type: 'choice',
                        word: w.word,
                        phonetic: w.phonetic || '',
                        answer: correct,
                        options: shuffle([correct, ...distractors])
                    });
                });

                return shuffle(questions);
            }

            function startDictation() {
                if (words().length === 0) return;

                dictationState.quiz = {
                    title: window.studyTitle || '每週測驗',
                    questions: buildDictationQuestions(),
                    index: 0,
                    correct: 0,
                    wrong: 0,
                    answered: false,
                    review: []
                };

                $('dictation-body').hidden = false;
                $('dictation-results').hidden = true;
                $('d-subtitle').textContent = dictationState.quiz.title;

                openModal('dictation-modal');
                renderDictationQuestion();
            }

            function currentDQ() {
                return dictationState.quiz ? dictationState.quiz.questions[dictationState.quiz.index] : null;
            }

            function renderDictationQuestion() {
                const st = dictationState.quiz;
                const q = currentDQ();
                if (!st || !q) return;
                st.answered = false;

                const total = st.questions.length;
                $('d-progress-fill').style.width = `${(st.index / total) * 100}%`;
                $('d-progress-text').textContent = `第 ${st.index + 1} 題 / 共 ${total} 題`;

                const feedback = $('d-feedback');
                feedback.className = 'quiz-feedback';
                feedback.textContent = '';

                const nextBtn = $('d-next');
                nextBtn.disabled = true;
                nextBtn.textContent = st.index === total - 1 ? '查看結果' : '下一題';

                if (q.type === 'dictation') {
                    const badge = $('d-type');
                    badge.textContent = '聽寫';
                    badge.className = 'quiz-type-badge dictation';
                    $('d-dictation').hidden = false;
                    $('d-choice').hidden = true;
                    $('d-hint').innerHTML = '按喇叭聽發音，然後拼出單字';
                    const input = $('d-input');
                    input.value = '';
                    input.disabled = false;
                    $('d-submit').disabled = false;
                    $('d-hint-btn').disabled = false;
                    setTimeout(() => input.focus(), 50);
                    speak(q.answer, 0.75);
                } else {
                    const badge = $('d-type');
                    badge.textContent = '詞義選擇';
                    badge.className = 'quiz-type-badge choice';
                    $('d-dictation').hidden = true;
                    $('d-choice').hidden = false;
                    stopSpeaking();
                    $('d-word').textContent = q.word;
                    const optionsEl = $('d-options');
                    optionsEl.innerHTML = q.options.map((opt, i) => `
                        <button class="quiz-option" type="button" data-index="${i}" data-correct="${opt === q.answer}">
                            ${String.fromCharCode(65 + i)}. ${opt}
                        </button>
                    `).join('');
                    optionsEl.querySelectorAll('.quiz-option').forEach(btn => {
                        btn.addEventListener('click', () => handleDictationChoice(btn));
                    });
                }
            }

            function showDictationHint() {
                const q = currentDQ();
                if (!q) return;
                const key = q.answer || q.word;
                const first = key.charAt(0);
                const masked = first + ' ' + '_ '.repeat(Math.max(0, key.replace(/\s/g, '').length - 1)).trim();
                $('d-hint').innerHTML = `
                    <span class="hint-word">${masked}</span><br>
                    ${q.phonetic}　${q.chinese}
                `;
            }

            function submitDictation() {
                const st = dictationState.quiz;
                if (!st || st.answered) return;
                const q = currentDQ();
                if (!q || q.type !== 'dictation') return;

                const input = $('d-input');
                const user = input.value.trim();
                if (!user) { input.focus(); return; }
                st.answered = true;

                const ok = normalize(user) === normalize(q.answer);
                input.disabled = true;
                $('d-submit').disabled = true;
                $('d-hint-btn').disabled = true;

                const feedback = $('d-feedback');
                if (ok) {
                    st.correct++;
                    feedback.className = 'quiz-feedback visible correct';
                    feedback.textContent = `正確！${q.answer}${q.chinese ? '（' + q.chinese + '）' : ''}`;
                } else {
                    st.wrong++;
                    feedback.className = 'quiz-feedback visible incorrect';
                    feedback.textContent = `錯誤。正確拼法：${q.answer}`;
                    st.review.push({ word: q.word, user, answer: q.answer });
                }

                const nextBtn = $('d-next');
                nextBtn.disabled = false;
                nextBtn.focus();
            }

            function handleDictationChoice(btn) {
                const st = dictationState.quiz;
                if (!st || st.answered) return;
                st.answered = true;

                const q = currentDQ();
                const isCorrect = btn.dataset.correct === 'true';

                $('d-options').querySelectorAll('.quiz-option').forEach(opt => {
                    opt.disabled = true;
                    if (opt.dataset.correct === 'true') opt.classList.add('correct');
                });

                const feedback = $('d-feedback');
                if (isCorrect) {
                    st.correct++;
                    feedback.className = 'quiz-feedback visible correct';
                    feedback.textContent = '正確！';
                } else {
                    btn.classList.add('incorrect');
                    st.wrong++;
                    feedback.className = 'quiz-feedback visible incorrect';
                    feedback.textContent = `錯誤。正確答案：${q.answer}`;
                    st.review.push({ word: q.word, user: (btn.textContent.split('. ')[1] || '').trim(), answer: q.answer });
                }

                const nextBtn = $('d-next');
                nextBtn.disabled = false;
                nextBtn.focus();
            }

            function nextDictationQuestion() {
                const st = dictationState.quiz;
                if (!st || !st.answered) return;
                st.index++;
                if (st.index >= st.questions.length) {
                    showDictationResults();
                } else {
                    renderDictationQuestion();
                }
            }

            function showDictationResults() {
                const st = dictationState.quiz;
                $('dictation-body').hidden = true;
                $('dictation-results').hidden = false;

                const total = st.questions.length;
                const pct = total ? Math.round((st.correct / total) * 100) : 0;
                $('d-score').textContent = `${pct}%`;
                $('d-correct').textContent = st.correct;
                $('d-wrong').textContent = st.wrong;

                let msg;
                if (pct === 100) msg = '太厲害了！全部答對！';
                else if (pct >= 80) msg = '很棒！再複習少數幾個單字就完美了。';
                else if (pct >= 60) msg = '不錯，多練習幾次會更熟練。';
                else msg = '別灰心，再聽幾次、多寫幾遍就會記住！';
                $('d-msg').textContent = `${st.title}　${msg}`;

                const reviewEl = $('d-review');
                if (st.review.length === 0) {
                    reviewEl.innerHTML = '<div class="review-item"><span class="r-word">全部正確</span><span class="r-answer">沒有任何錯題 🎉</span></div>';
                } else {
                    reviewEl.innerHTML = st.review.map(r => `
                        <div class="review-item wrong">
                            <span class="r-word">${r.word}</span>
                            <span class="r-answer">你的答案：${r.user || '（空白）'} → 正確：${r.answer}</span>
                        </div>
                    `).join('');
                }
                stopSpeaking();
            }

            $('d-play')?.addEventListener('click', () => {
                const q = currentDQ();
                if (q && q.type === 'dictation') speak(q.answer, 0.75);
            });
            $('d-next')?.addEventListener('click', nextDictationQuestion);
            $('d-submit')?.addEventListener('click', submitDictation);
            $('d-hint-btn')?.addEventListener('click', showDictationHint);
            $('d-retry')?.addEventListener('click', startDictation);
            $('d-input')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const st = dictationState.quiz;
                    if (st && st.answered) nextDictationQuestion();
                    else submitDictation();
                }
            });

            cleanupHooks['dictation-modal'] = () => { stopSpeaking(); };

            // ============================================
            // ACTIVITY BUTTONS
            // ============================================
            document.querySelectorAll('.activity-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const activity = btn.dataset.activity;
                    switch (activity) {
                        case 'quiz': startQuiz(); break;
                        case 'matching': startMatching(); break;
                        case 'spelling': startSpelling(); break;
                        case 'race': startRace(); break;
                        case 'search': startWordSearch(); break;
                        case 'memory': startMemory(); break;
                        case 'dictation': startDictation(); break;
                    }
                });
            });
        });
    </script>
</body>
</html>
